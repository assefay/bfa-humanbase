<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Direction OCHA Burkina Faso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>window.AUTH_TITLE = 'HumanBase — Direction';</script>
<script src="../auth.js"></script>
<style>
:root{--blue:#026CB6;--blue-100:#D6E7F5;--blue-50:#EEF5FB;--ink:#0F1923;--mut:#4A6070;--light:#8A99A8;--line:#E2E8F0;--bg:#F4F7FA;
 --red:#B3261E;--red-50:#FCEBEA;--amber:#8A5A00;--amber-50:#FFF4DC;--green:#2E7D32;--green-50:#E8F5E9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans','Segoe UI',sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand small{display:block;color:var(--blue);font-weight:600;letter-spacing:.04em;font-size:11px}
.brand b{font-size:19px}
.bar .sp{flex:1}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav a{color:var(--mut);text-decoration:none;padding:7px 11px;border-radius:8px;font-weight:500;font-size:14px}
nav a:hover{background:var(--blue-50);color:var(--blue)}
nav a.on{background:var(--blue);color:#fff}
nav a.ask{border:1px solid var(--blue);color:var(--blue);margin-left:6px}
.period{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.period select,.period input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:14px 16px 80px}
.fresh{font-size:12.5px;color:var(--mut);margin:0 0 14px;line-height:1.7}
.fresh b{color:var(--ink);font-weight:500}.fresh .late{color:var(--amber);font-weight:600}
section{display:none}section.on{display:block}
h2{font-size:20px;margin:4px 0 4px;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin:22px 0 10px;font-weight:700}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.sev{border-left:5px solid var(--red)}.card.warn{border-left:5px solid #C98A00}.card.ok{border-left:5px solid var(--green)}
.card h4{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.35}
.card p{margin:0 0 4px;color:#24323F}
.src{display:block;margin-top:8px;font-size:12px;color:var(--light)}
/* tiles : libellé d'abord, puis le chiffre, puis une ligne de contexte lisible */
.tile .l{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
.tile .v{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:4px 0 2px}
.tile .v small{font-size:16px;font-weight:500;color:var(--mut)}
.tile .c{font-size:14px;color:#24323F}
.up{color:var(--red);font-weight:600}.down{color:var(--green);font-weight:600}.flat{color:var(--mut)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:9px;background:#F1F4F8;color:var(--mut);margin-left:6px;vertical-align:middle;font-weight:500}
.tag.red{background:var(--red-50);color:var(--red)}.tag.amb{background:var(--amber-50);color:var(--amber)}.tag.grn{background:var(--green-50);color:var(--green)}.tag.blue{background:var(--blue-50);color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin:10px 0 2px}
.bars div{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.cur{background:var(--blue-100);outline:1px dashed var(--blue)}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;margin-bottom:4px;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--light)}
.hbar{display:grid;grid-template-columns:150px 1fr 96px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar .t{height:11px;background:var(--blue-50);border-radius:6px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--blue);border-radius:6px}
.hbar .t i.low{background:var(--red)}.hbar .t i.mid{background:#C98A00}
.hbar .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:500;color:var(--blue);text-decoration:none}
.btn:hover{background:var(--blue-50)}
details{margin-top:10px}summary{cursor:pointer;color:var(--blue);font-weight:500;font-size:14px;list-style:none}
summary::before{content:'▸ ';font-size:11px}details[open] summary::before{content:'▾ '}
.det{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ev{padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev b{font-size:15px}.ev .m{color:var(--mut);font-size:13px}.ev p{margin:4px 0 0;color:#24323F}
.empty{color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cmp .c{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.cmp .c.me{border-color:var(--blue);background:var(--blue-50)}.cmp .v{font-size:28px;font-weight:700}.cmp .l{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
.media li{margin:0 0 10px}.media a{color:var(--ink);font-weight:600;text-decoration:none;font-size:15px}.media a:hover{color:var(--blue)}.media .m{color:var(--light);font-size:13px}
#loading{position:fixed;inset:0;background:rgba(244,247,250,.85);display:flex;align-items:center;justify-content:center;z-index:20;color:var(--mut);font-size:15px}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.g3,.g2,.g4,.cmp{grid-template-columns:1fr}.hbar{grid-template-columns:110px 1fr 54px}.tile .v{font-size:28px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><small>OCHA BURKINA FASO · HUMANBASE</small><b>Tableau de bord — Direction</b></div>
  <div class="period">Période :
    <select id="preset"><option value="week">Semaine dernière (rapport hebdo)</option><option value="7">7 derniers jours</option><option value="30">30 derniers jours</option><option value="ytd">Depuis le 1er janvier</option><option value="custom">Personnalisée</option></select>
    <span id="customRange" style="display:none"><input type="date" id="dFrom"> → <input type="date" id="dTo"> <button class="btn" id="goRange">OK</button></span>
    <b id="periodLabel" style="color:var(--ink)"></b>
  </div>
  <span class="sp"></span>
  <nav id="tabs"><a href="#faits">Faits marquants</a><a href="#incidents">Incidents sécuritaires</a><a href="#deplacements">Déplacements</a><a href="#acces">Accès</a><a href="#reponse">Réponse</a><a href="#financement">Financement</a><a href="#medias">Médias</a><a class="ask" href="../" target="_blank" rel="noopener">Poser une question ↗</a></nav>
</div></header>
<main id="main">
  <p class="fresh" id="fresh"></p>
  <section id="tab-faits"></section>
  <section id="tab-incidents"></section>
  <section id="tab-deplacements"></section>
  <section id="tab-acces"></section>
  <section id="tab-reponse"></section>
  <section id="tab-financement"></section>
  <section id="tab-medias"></section>
</main>
<div id="loading">Chargement des données…</div>

<script>
'use strict';
const SB = 'https://vshnatreclfntadwcyhy.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzaG5hdHJlY2xmbnRhZHdjeWh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTA4NzcsImV4cCI6MjA4OTg2Njg3N30.VOxHkUKvYKtsdc2iwmsDMP9w-BWh3LZ4ZFLD4-qzjd8';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => v == null ? '—' : Number(v).toLocaleString('fr-FR');
const MO = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOL = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fd = d => { if (!d) return '—'; const x = new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')); return x.getDate() + ' ' + MO[x.getMonth()]; };
const fdl = d => { if (!d) return '—'; const x = new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')); return x.getDate() + ' ' + MOL[x.getMonth()] + ' ' + x.getFullYear(); };
const iso = d => d.toISOString().slice(0, 10);
const ask = q => `<a class="btn" href="../?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Demander : « ${esc(q)} »</a>`;
const delta = (cur, prev, inv) => { if (cur == null || prev == null) return ''; const d = cur - prev; if (!d) return '<span class="flat">= période précédente</span>';
  const cls = (d > 0) !== !!inv ? 'up' : 'down'; return `<span class="${cls}">${d > 0 ? '▲ +' : '▼ '}${n0(d)}</span> <span class="flat">vs période précédente (${n0(prev)})</span>`; };
const tile = (l, v, c, src, cls = '') => `<div class="card tile ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c || ''}</div>${src ? `<span class="src">${src}</span>` : ''}</div>`;
function bars(arr, key, unit, start = 0, curIdx = -1) { const m = Math.max(1, ...arr.map(a => +a[key] || 0));
  return `<div class="bars">${arr.map((a, i) => `<div style="height:${Math.max(3, (+a[key] || 0) / m * 100)}%" class="${i === curIdx ? 'cur' : ''}" data-t="${MO[(a.mois || start + i + 1) - 1]} : ${n0(a[key])} ${unit}"></div>`).join('')}</div><div class="axis"><span>${MO[(arr[0]?.mois || 1) - 1]}</span><span>${MO[(arr[arr.length - 1]?.mois || 12) - 1]}</span></div>`; }
function hbars(rows, lab, val, fmt, cls) { const m = Math.max(1, ...rows.map(r => +val(r) || 0));
  return rows.map(r => `<div class="hbar"><span class="lab" title="${esc(lab(r))}">${esc(lab(r))}</span><span class="t"><i class="${cls ? cls(+val(r)) : ''}" style="width:${(+val(r) || 0) / m * 100}%"></i></span><span class="n">${fmt(r)}</span></div>`).join(''); }

let D = null, P = { from: null, to: null };

async function load() {
  $('#loading').style.display = 'flex';
  const body = P.from ? { p_from: P.from, p_to: P.to } : {};
  const r = await fetch(SB + '/rest/v1/rpc/direction_dashboard', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + AUTH.token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { $('#loading').textContent = 'Erreur de chargement (' + r.status + ') : ' + (await r.text()).slice(0, 200); return; }
  D = await r.json(); render(); $('#loading').style.display = 'none';
}

function render() {
  const m = D.meta; const partial = {};
  $('#periodLabel').textContent = 'du ' + fdl(m.from) + ' au ' + fdl(m.to);
  // ACLED / GCORR / rapport hebdo couvrent-ils la période ?
  partial.acled = m.acled_sync?.max_event < m.to; partial.weekly = m.weekly_last < m.to; partial.ocha = m.ocha_inc_last < m.to; partial.gcorr = m.gcorr_sync?.max_diffusion < m.to;
  const late = (d, days) => (new Date(m.to) - new Date(d)) / 864e5 > days;
  $('#fresh').innerHTML = `<b>Dernières données —</b> rapport hebdo <b>${fd(m.weekly_last)}</b> · Daily Update <b>e-mail du ${fd(m.daily_last_email)}</b> · incidents terrain OCHA <b>${fd(m.ocha_inc_last)}</b> · ACLED <b>synchronisé le ${fd(m.acled_sync?.run_at)}</b> (publié jusqu'au ${fd(m.acled_sync?.max_event)}) · GCORR <b>synchronisé le ${fd(m.gcorr_sync?.run_at)}</b> (dernière alerte du ${fd(m.gcorr_sync?.max_diffusion)}) · zones enclavées <b class="${late(m.zones_last, 21) ? 'late' : ''}">${fd(m.zones_last)}</b> · convois <b class="${late(m.convois_last, 35) ? 'late' : ''}">${fd(m.convois_last)}</b> · UNHAS <b>${MOL[new Date(m.unhas_last).getMonth()]}</b> · réponse <b class="${late(new Date(2026, m.reached_last_month, 1), 45) ? 'late' : ''}">fin ${MOL[m.reached_last_month - 1]}</b> · FTS <b>${fd(m.fts_date)}</b>`;
  renderFaits(partial); renderIncidents(partial); renderDeplacements(partial); renderAcces(); renderReponse(); renderFinancement(); renderMedias();
}

// ---------- 1. FAITS MARQUANTS ----------
function renderFaits(partial) {
  const F = D.faits, m = D.meta; const weeks = F.weeks || [];
  // cartes : une par région avec du contenu, triées par gravité (déjà triées côté base)
  const cards = weeks.filter(w => w.ps && !/^aucun/i.test(w.ps)).map(w => {
    const sev = (w.tues || 0) >= 3 || (w.dep || 0) >= 2000 ? 'sev' : (w.tues || 0) > 0 || (w.dep || 0) > 0 || /attaque|enlev|tué|drone/i.test(w.ps) ? 'warn' : '';
    return `<div class="card ${sev}"><h4>${esc(w.region)} : ${esc(w.ps)}</h4><p>${esc(w.sec || '')}</p>${w.mvt && !/^aucun/i.test(w.mvt) ? `<p>${esc(w.mvt)}</p>` : ''}${w.acc ? `<p><i>Accès :</i> ${esc(w.acc)}</p>` : ''}<span class="src">Rapport hebdomadaire, semaine du ${fd(w.week_start)} au ${fd(w.week_end)}${w.tues ? ' · ' + w.tues + ' civil(s) tué(s)' : ''}${w.dep ? ' · ' + n0(w.dep) + ' déplacés estimés' : ''}</span></div>`;
  });
  const sr = F.since_report; const since = [];
  (sr.gcorr || []).forEach(a => since.push(`<div class="ev"><b>${n0(a.pers)} personnes déplacées</b> arrivées à ${esc(a.com)} (${esc(a.reg)}) depuis ${esc(a.orig)} <span class="m">· GCORR, ${fd(a.d)}</span></div>`));
  (sr.daily || []).forEach(a => since.push(`<div class="ev"><b>${esc(a.c.split(':')[0])}</b> <span class="m">· Daily Update, ${fd(a.d)}${a.reg ? ' · ' + esc(a.reg) : ''}</span><p>${esc(a.c.split(':').slice(1).join(':').trim())}</p></div>`));
  (sr.acled || []).forEach(a => since.push(`<div class="ev"><b>${esc(a.type)} à ${esc(a.loc)} (${esc(a.prov)}, ${esc(a.reg)})${a.morts ? ' — ' + a.morts + ' mort(s)' : ''}</b> <span class="m">· ACLED, ${fd(a.d)}</span><p>${esc(a.notes)}</p></div>`));
  (sr.ocha || []).forEach(a => since.push(`<div class="ev"><b>${esc(a.type)} : ${esc(a.loc || a.com)} (${esc(a.reg)})${a.tues ? ' — ' + a.tues + ' civil(s) tué(s)' : ''}</b> <span class="m">· terrain OCHA, ${fd(a.d)}</span><p>${esc(a.desc || '')}</p></div>`));
  const t = F.tot || {}, tp = F.tot_prev || {};
  $('#tab-faits').innerHTML = `<h2>Faits marquants</h2><p class="sub">Semaine${t.n_weeks > 1 ? 's' : ''} du rapport hebdomadaire couvrant la période, complétée par les Daily Updates${partial.weekly ? ' <span class="tag amb">rapport hebdo disponible jusqu\'au ' + fd(m.weekly_last) + '</span>' : ''}</p>
    <div class="grid g3">${tile('Civils tués', n0(t.tues), delta(t.tues, tp.tues), 'Rapports hebdomadaires OCHA (sections régionales)')}
      ${tile('Nouveaux déplacés estimés', n0(t.dep), delta(t.dep, tp.dep), 'Rapports hebdomadaires — estimations terrain, voir GCORR pour les chiffres validés')}
      ${tile('Régions avec un fait marquant', cards.length, (F.daily || []).length + ' item(s) dans les Daily Updates', 'weekly_reports · daily_updates')}</div>
    ${since.length && m.weekly_last <= m.to ? `<h3 class="sec">Depuis le dernier rapport hebdo (après le ${fd(m.weekly_last)})</h3><div class="card">${since.join('')}</div>` : ''}
    <h3 class="sec">Par région</h3><div class="grid g2">${cards.join('') || '<div class="empty">Aucun rapport hebdomadaire sur cette période.</div>'}</div>
    ${(F.daily || []).length ? `<details class="card"><summary>Daily Updates de la période (${F.daily.length})</summary><div class="det">${F.daily.map(a => `<div class="ev"><b>${esc(a.c.split(':')[0])}</b> <span class="m">· ${fd(a.d)}${a.reg ? ' · ' + esc(a.reg) : ''}</span><p>${esc(a.c.split(':').slice(1).join(':').trim())}</p>${a.action ? `<p><i>OCHA :</i> ${esc(a.action)}</p>` : ''}</div>`).join('')}</div></details>` : ''}
    <div class="acts">${ask('Que s\'est-il passé cette semaine dans le ' + (cards[0] ? weeks.filter(w => w.ps && !/^aucun/i.test(w.ps))[0].region : 'Sahel') + ' ?')}${ask('Résume la situation humanitaire de la semaine')}</div>`;
}

// ---------- 2. INCIDENTS ----------
function renderIncidents(partial) {
  const I = D.incidents, m = D.meta;
  const th = k => ({ O: I.themes.find(x => x.source === 'OCHA' && x.theme === k) || {}, A: I.themes.find(x => x.source === 'ACLED' && x.theme === k) || {} });
  const T = [['tous', 'Tous incidents'], ['drone', 'Drones'], ['eei', 'EEI'], ['convoi', 'Attaques contre convois'], ['enlevement', 'Enlèvements'], ['humanitaires', 'Humanitaires ciblés'], ['pillage_betail', 'Pillage / bétail'], ['sante', 'Santé'], ['education', 'Éducation']];
  const acledTag = partial.acled ? `<span class="tag amb" title="ACLED a publié jusqu'au ${fd(m.acled_sync?.max_event)}">partiel</span>` : '';
  const tiles = T.map(([k, l]) => { const { O, A } = th(k);
    return `<div class="card tile"><div class="l">${l}</div><div class="v">${n0(O.n || 0)} <small>OCHA</small> &nbsp; ${n0(A.n || 0)} <small>ACLED${acledTag}</small></div>
      <div class="c">${(O.morts || A.morts) ? `${n0((O.morts || 0))} / ${n0(A.morts || 0)} morts · ` : ''}période précédente : ${n0(O.n_prev || 0)} / ${partial.acled ? '—' : n0(A.n_prev || 0)}</div></div>`; }).join('');
  const maj = (I.majeurs || []).map(e => `<div class="ev"><b>${fd(e.d)} — ${esc(e.loc)} (${esc(e.com || e.prov)}, ${esc(e.reg)}) : ${esc(e.type)}${e.morts ? ', ' + e.morts + ' mort(s)' : ''}</b>${(e.th || []).map(x => `<span class="tag red">${esc(x)}</span>`).join('')}<div class="m">${esc(e.a1)}${e.a2 ? ' → ' + esc(e.a2) : ''}${e.civ ? ' · ' + esc(e.civ) : ''}</div><p>${esc(e.notes)}</p></div>`).join('');
  const ocha = (I.ocha_list || []).map(e => `<div class="ev"><b>${fd(e.d)} — ${esc(e.loc || e.com || e.reg)} (${esc(e.reg)}) : ${esc(e.type)}${e.tues ? ', ' + e.tues + ' civil(s) tué(s)' : ''}${e.dep ? ', ' + n0(e.dep) + ' déplacés' : ''}</b><p>${esc(e.desc || '')}${e.hum ? ' <i>' + esc(e.hum) + '</i>' : ''}</p></div>`).join('');
  const mo = I.mensuel || []; const mO = mo.filter(x => x.src === 'OCHA'), mA = mo.filter(x => x.src === 'ACLED');
  const ct = I.civils_tues || {};
  $('#tab-incidents').innerHTML = `<h2>Incidents sécuritaires</h2><p class="sub">Terrain OCHA et ACLED côte à côte, jamais additionnés${partial.acled ? ' — ACLED publié jusqu\'au ' + fd(m.acled_sync?.max_event) + ', donc partiel pour cette période' : ''}</p>
    <div class="grid g3">${tile('Civils tués (terrain OCHA)', n0(ct.n || 0), delta(ct.n, ct.n_prev), 'ocha_field_incidents')}
      ${tile('Morts toutes catégories (ACLED)', n0(th('tous').A.morts || 0) + (partial.acled ? ' <small>partiel</small>' : ''), partial.acled ? `<span class="flat">comparaison suspendue : ACLED publié jusqu'au ${fd(m.acled_sync?.max_event)}</span>` : delta(th('tous').A.morts, th('tous').A.morts_prev), 'acled_incidents — batailles, explosions, violences contre civils')}
      ${tile('Régions les plus touchées (ACLED, période)', (I.acled_regions || []).slice(0, 3).map(r => esc(r.region)).join(', ') || '—', (I.acled_regions || []).slice(0, 3).map(r => `${esc(r.region)} : ${r.morts} morts / ${r.n} év.`).join(' · '), 'acled_incidents')}</div>
    <h3 class="sec">Par thème — OCHA / ACLED</h3><div class="grid g3">${tiles}</div>
    <h3 class="sec">Événements majeurs ACLED (≥ 5 morts, ou convoi / humanitaire / santé / éducation visés)</h3><div class="card">${maj || '<p class="flat">Aucun événement majeur publié par ACLED sur cette période.</p>'}</div>
    <h3 class="sec">Incidents rapportés par les bureaux OCHA</h3><div class="card">${ocha || '<p class="flat">Aucun incident terrain sur cette période.</p>'}</div>
    <div class="grid g2" style="margin-top:12px"><div class="card tile"><div class="l">Incidents terrain OCHA par mois (${new Date(m.to).getFullYear()})</div>${bars(mO, 'n', 'incidents', 0, mO.length - 1)}<span class="src">dernier mois en cours, incomplet</span></div>
      <div class="card tile"><div class="l">Morts ACLED par mois (${new Date(m.to).getFullYear()})</div>${bars(mA, 'morts', 'morts', 0, mA.length - 1)}<span class="src">dernier mois en cours, incomplet</span></div></div>
    <div class="acts">${ask('Attaques de drones depuis septembre 2026')}${ask('Incidents contre les convois humanitaires en 2026')}${ask('Situation sécuritaire dans le Liptako')}</div>`;
}

// ---------- 3. DÉPLACEMENTS ----------
function renderDeplacements(partial) {
  const G = D.deplacements, m = D.meta; const t = G.tot || {}, tp = G.tot_prev || {}, an = G.annee || {}, ap = G.annee_prec || {};
  const al = (G.alertes || []).map(a => `<div class="ev"><b>${n0(a.pers)} personnes (${n0(a.men)} ménages)</b> arrivées à <b>${esc(a.com)}</b>${a.villages ? ' (' + esc(a.villages) + ')' : ''}, ${esc(a.prov)} / ${esc(a.reg)}, en provenance de ${esc(a.orig)}${a.orig_prov && a.orig_prov !== a.prov ? ' (' + esc(a.orig_prov) + ')' : ''}
    <div class="m">Arrivée ${fd(a.d)} · choc du ${fd(a.choc)} : ${esc(({'Security Incident':'incident sécuritaire'})[a.type] || a.type)}${a.sev ? ' · sévérité ' + esc(({High:'élevée',Medium:'moyenne',Low:'faible'})[a.sev] || a.sev) : ''} · alerte ${esc(a.id || a.dep_id)}${a.f != null ? ` · ${n0(a.f)} femmes, ${n0(a.h)} hommes, ${n0(a.fi)} filles, ${n0(a.g)} garçons` : ''}</div>
    ${a.desc ? `<details><summary>Description et besoins</summary><div class="det"><p>${esc(a.desc)}</p>${a.besoins ? `<p><b>Besoins prioritaires :</b> ${esc(a.besoins)}</p>` : ''}</div></details>` : ''}
    <div class="acts" style="margin-top:8px">${ask('Qui répond aux déplacés arrivés à ' + a.com + ' ?')}</div></div>`).join('');
  const other = [...(G.weekly_mvt || []).map(w => `<div class="ev"><b>${esc(w.region)}</b> <span class="m">· rapport hebdo ${fd(w.week_end)} · ${n0(w.dep)} déplacés estimés</span><p>${esc(w.mvt)}</p></div>`),
                 ...(G.daily_dep || []).map(a => `<div class="ev"><b>${esc(a.c.split(':')[0])}</b> <span class="m">· Daily Update ${fd(a.d)}</span><p>${esc(a.c.split(':').slice(1).join(':').trim())}</p></div>`)].join('');
  $('#tab-deplacements').innerHTML = `<h2>Déplacements</h2><p class="sub">Alertes GCORR validées (OCHA / ECHO) — ${partial.gcorr ? 'dernière alerte publiée le ' + fd(m.gcorr_sync?.max_diffusion) : 'à jour'}</p>
    <div class="grid g3">${tile('Personnes nouvellement déplacées sur la période', n0(t.pers || 0), `${t.n || 0} alerte(s)${tp.pers != null ? ' · ' + delta(t.pers, tp.pers) : (tp.n === 0 ? ' · aucune la période précédente' : '')}`, 'gcorr_alerts, date d\'arrivée dans la période')}
      ${tile('Depuis le 1er janvier ' + an.an, n0(an.pers), `${an.n} alertes · ${n0(ap.pers)} sur toute l'année ${an.an - 1}`, 'gcorr_alerts')}
      ${tile('Stock de personnes déplacées (HPC 2026)', n0(G.stock?.pdi), `${n0(G.stock?.retournes)} retournés · PIN ${n0(G.stock?.pin)}`, 'hpc_pin, groupes de population')}</div>
    <h3 class="sec">Derniers déplacements</h3><div class="card">${al || '<p class="flat">Aucune alerte GCORR avec arrivée sur cette période.</p>'}</div>
    ${other ? `<h3 class="sec">Mouvements signalés par le terrain (non encore validés GCORR)</h3><div class="card">${other}</div>` : ''}
    <div class="grid g2" style="margin-top:12px"><div class="card tile"><div class="l">Personnes déplacées par mois (${an.an})</div>${bars(G.mensuel || [], 'pers', 'personnes', 0, (G.mensuel || []).length - 1)}</div>
      <div class="card tile"><div class="l">Régions d'arrivée depuis le 1er janvier</div>${hbars((G.regions || []).slice(0, 8), r => r.region, r => r.pers, r => n0(r.pers))}</div></div>
    <div class="acts">${ask('Déplacements dans le Sourou en 2026')}${ask('Besoins prioritaires des derniers déplacés')}</div>`;
}

// ---------- 4. ACCÈS ----------
function renderAcces() {
  const A = D.acces, m = D.meta; const z = A.zones?.[0] || {}, zp = A.zones?.[1] || {};
  const cs = (A.convoi_synthese || []).find(x => /TOTAL/.test(x.groupe)) || {}; const g1 = (A.convoi_synthese || []).find(x => /^1/.test(x.groupe)) || {};
  const u = A.unhas || []; const ul = u[u.length - 1] || {}, up = u[u.length - 2] || {};
  const pr = A.perception?.[0] || {}, prp = A.perception?.[1] || {};
  const zc = A.zones_changes || {};
  const changes = [...(A.convois_periode || []).map(c => `<div class="ev"><b>Convoi ${esc(c.depart)} → ${esc(c.dest)}</b> <span class="m">· ${fd(c.d)} · ${esc(c.reg)}</span>${c.intrants ? `<p>${esc(c.intrants)}</p>` : ''}</div>`),
    ...(A.weekly_acc || []).map(w => `<div class="ev"><b>${esc(w.region)}</b> <span class="m">· rapport hebdo ${fd(w.week_end)}</span><p>${esc(w.acc)}</p></div>`),
    ...((zc.nouvelles || []).length ? [`<div class="ev"><b>Nouvelle(s) localité(s) enclavée(s) au ${fd(zc.d2)}</b><p>${zc.nouvelles.map(esc).join(' · ')}</p></div>`] : []),
    ...((zc.sorties || []).length ? [`<div class="ev"><b>Localité(s) sortie(s) de la liste au ${fd(zc.d2)}</b><p>${zc.sorties.map(esc).join(' · ')}</p></div>`] : [])].join('');
  $('#tab-acces').innerHTML = `<h2>Accès humanitaire</h2><p class="sub">Zones enclavées, convois, UNHAS et perception des partenaires — quatre lectures d'une même réalité</p>
    <div class="grid g4">${tile('Localités enclavées ou inaccessibles', n0((z.localites_niv2 || 0) + (z.localites_niv3 || 0)), `${n0((z.pop_niv2 || 0) + (z.pop_niv3 || 0))} personnes, dont ${n0(z.pdi)} PDI toutes localités · ${delta((z.localites_niv2 || 0) + (z.localites_niv3 || 0), zp.localites_niv2 != null ? (zp.localites_niv2 || 0) + (zp.localites_niv3 || 0) : null)}`, `zone_enclavees au ${fd(z.report_date)}` + ((new Date(m.to) - new Date(z.report_date)) / 864e5 > 21 ? ' <span class="tag amb">mise à jour attendue</span>' : ''))}
      ${tile('Communes sans convoi possible', n0(cs.communes_inaccessibles), `${n0(cs.communes_convoi_regulier)} à convoi régulier · ${n0(cs.communes_convoi_irregulier)} à convoi irrégulier · les 15 provinces concernées = ${g1.pct_pin_national} % du PIN`, 'Classification de l\'équipe accès (' + esc(m.convoi_classif || '') + ')')}
      ${tile('UNHAS en ' + MOL[new Date(ul.mois || m.to).getMonth()], n0(ul.pax_total) + ' <small>passagers</small>', `${(ul.cargo_kg / 1000).toFixed(1).replace('.', ',')} t de fret · ${ul.destinations_pax} destinations · ${delta(ul.pax_total, up.pax_total, true)}`, 'UNHAS / PAM, données mensuelles')}
      ${tile('Communes à contraintes élevées (perception)', n0(pr.eleve) + ' <small>sur ' + n0(pr.n) + '</small>', `${delta(pr.eleve, prp.eleve)} · score moyen ${String(pr.moy).replace('.', ',')} (contraintes modérées)`, 'access_perception, round ' + esc(pr.round))}</div>
    <h3 class="sec">Ce qui a changé sur la période</h3><div class="card">${changes || '<p class="flat">Aucun convoi, aucun changement de zone ni information d\'accès rapportés sur cette période.</p>'}</div>
    <div class="grid g2" style="margin-top:12px"><div class="card tile"><div class="l">Population en localités enclavées ou inaccessibles, par région</div>${hbars((A.zones_regions || []).slice(0, 9), r => r.region, r => r.pop, r => n0(r.pop) + ` <span style="color:var(--light);font-weight:400">· ${r.loc} loc.</span>`)}<span class="src">v_zones_summary au ${fd(z.report_date)}</span></div>
      <div class="card tile"><div class="l">Passagers UNHAS par mois</div>${bars(u.map(x => ({ mois: new Date(x.mois).getMonth() + 1, v: x.pax_total })), 'v', 'passagers')}<span class="src">v_unhas_mensuel</span>
        <details><summary>Cohérence des quatre lectures</summary><div class="det"><p>${n0(A.coherence)} communes où la classification convoi, la perception des partenaires et les zones enclavées ne disent pas la même chose — fichier de vérification envoyé à l'équipe accès le 23 octobre.</p></div></details></div></div>
    <details class="card" style="margin-top:12px"><summary>Derniers convois chargés (${(A.convois_recents || []).length})</summary><div class="det">${(A.convois_recents || []).map(c => `<div class="ev"><b>${esc(c.depart)} → ${esc(c.dest)}</b> <span class="m">· ${fd(c.d)} · ${esc(c.reg)}</span></div>`).join('')}</div></details>
    <div class="acts">${ask('Situation des convois humanitaires')}${ask('Accès aérien UNHAS vers Djibo')}${ask('Localités enclavées du Koulsé')}</div>`;
}

// ---------- 5. RÉPONSE ----------
function renderReponse() {
  const R = D.reponse || []; const m = D.meta; const inter = R.find(r => r.cluster === 'INTERSECTORIEL') || {};
  const lab = { WASH: 'Eau, hygiène, assainissement', ABRIS: 'Abris / AME', PRO: 'Protection', EDU: 'Éducation', GSAT: 'Gestion des sites', refugee: 'Réfugiés', NUT: 'Nutrition', SECAL: 'Sécurité alimentaire', SANTE: 'Santé', INTERSECTORIEL: 'Intersectoriel' };
  const elapsed = Math.round(m.reached_last_month / 12 * 100);
  $('#tab-reponse').innerHTML = `<h2>Réponse humanitaire</h2><p class="sub">Personnes atteintes depuis janvier, monitoring intersectoriel — dernier mois rapporté : ${MOL[m.reached_last_month - 1]}</p>
    <div class="grid g3">${tile('Personnes atteintes', n0(inter.atteints), `sur ${n0(inter.cible)} ciblées`, 'v_cluster_coverage national')}
      ${tile('Couverture de la cible', String(inter.pct).replace('.', ',') + ' %', `à fin ${MOL[m.reached_last_month - 1]}, soit ${elapsed} % de l'année écoulée`, inter.pct < elapsed - 15 ? '<span class="tag red">en retard sur l\'année</span>' : '')}
      ${tile('Clusters sous 25 % de couverture', R.filter(r => r.cluster !== 'INTERSECTORIEL' && r.pct < 25).map(r => lab[r.cluster] || r.cluster).join(', ') || 'aucun', '', 'v_cluster_coverage')}</div>
    <div class="card tile" style="margin-top:12px"><div class="l">Couverture de la cible par cluster</div>${hbars(R.filter(r => r.cluster !== 'INTERSECTORIEL'), r => lab[r.cluster] || r.cluster, r => r.pct, r => String(r.pct).replace('.', ',') + ' %', v => v < 25 ? 'low' : v < 40 ? 'mid' : '')}<span class="src">rouge &lt; 25 %, orange &lt; 40 %</span></div>
    <div class="acts">${ask('Couverture par cluster dans les provinces en sévérité 4')}${ask('Qui fait quoi dans le Sourou ?')}</div>`;
}

// ---------- 6. FINANCEMENT ----------
function renderFinancement() {
  const Fi = D.financement; const nat = Fi.national || []; const cur = nat[0] || {}, prev = nat[1] || {};
  const musd = v => v == null ? '—' : (v / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' M US$';
  const comp = (Fi.comparaison || []).filter(c => c.financement_2026_usd != null); const last = comp[comp.length - 1] || {};
  const m25 = Math.max(1, ...(Fi.comparaison || []).map(c => +c.financement_2025_usd || 0));
  const dual = `<div class="bars" style="gap:6px">${comp.map(c => `<div style="display:flex;gap:2px;flex:1;height:100%;align-items:flex-end;background:none"><div style="flex:1;height:${c.financement_2026_usd / m25 * 100}%" data-t="${MO[c.mois - 1]} 2026 : ${musd(c.financement_2026_usd)}"></div><div class="cur" style="flex:1;height:${c.financement_2025_usd / m25 * 100}%;outline:0" data-t="${MO[c.mois - 1]} 2025 : ${musd(c.financement_2025_usd)}"></div></div>`).join('')}</div><div class="axis"><span>${MO[(comp[0]?.mois || 1) - 1]}</span><span>${MO[(last.mois || 12) - 1]} · bleu = ${cur.annee}, clair = ${cur.annee - 1}</span></div>`;
  $('#tab-financement').innerHTML = `<h2>Financement du plan ${cur.annee}</h2><p class="sub">FTS au ${fdl(cur.date_maj)} — base de la mise à jour bimensuelle pour le chef de bureau</p>
    <div class="grid g3">${tile('HNRP ' + cur.annee + ' financé', String(cur.couverture_pct).replace('.', ',') + ' %', `${musd(cur.financement_usd)} reçus sur ${musd(cur.besoins_usd)} · déficit ${musd(cur.deficit_usd)}`, 'v_fts_couverture_nationale')}
      ${tile('À la même date en ' + (cur.annee - 1), musd(last.financement_2025_usd), `<span class="${last.ecart_pct < 0 ? 'up' : 'down'}">${last.ecart_pct > 0 ? '+' : ''}${String(last.ecart_pct).replace('.', ',')} %</span> cette année (${musd(last.financement_2026_usd)})`, 'v_fts_comparaison_annuelle, cumul à fin ' + MOL[(last.mois || 1) - 1])}
      ${tile('Année ' + prev.annee + ' (clôture)', String(prev.couverture_pct).replace('.', ',') + ' %', `${musd(prev.financement_usd)} sur ${musd(prev.besoins_usd)}`, 'v_fts_couverture_nationale')}</div>
    <div class="grid g3" style="margin-top:12px"><div class="card tile"><div class="l">Cumul mensuel ${cur.annee} vs ${cur.annee - 1}</div>${dual}</div>
      <div class="card tile"><div class="l">Clusters les moins financés</div>${hbars((Fi.clusters || []).slice(0, 9), r => r.cluster, r => r.pct, r => String(r.pct).replace('.', ',') + ' %', v => v < 10 ? 'low' : v < 20 ? 'mid' : '')}</div>
      <div class="card tile"><div class="l">Principaux bailleurs</div>${hbars((Fi.bailleurs || []).slice(0, 7), r => r.b.replace("European Commission's Humanitarian Aid and Civil Protection Department", 'ECHO (UE)').replace(', Government of', '').replace('Central Emergency Response Fund', 'CERF'), r => r.usd, r => musd(r.usd) + ` <span style="color:var(--light);font-weight:400">· ${r.pct} %</span>`)}</div></div>
    <div class="card" style="margin-top:12px"><div class="tile"><div class="l">Comparaison régionale — plans de réponse ${cur.annee}</div></div>
      <div class="cmp" style="margin-top:10px"><div class="c me"><div class="v">${String(cur.couverture_pct).replace('.', ',')} %</div><div class="l"><b>Burkina Faso</b> · ${musd(cur.financement_usd)} / ${musd(cur.besoins_usd)}<br>FTS, ${fd(cur.date_maj)}</div></div>
        <div class="c"><div class="v">23 %</div><div class="l"><b>Mali</b> · 136 M / 578 M US$<br>OCHA Mali, 28 sept. <span class="tag amb">provisoire</span></div></div>
        <div class="c"><div class="v">—</div><div class="l"><b>Niger</b> · plan 449 M US$<br>financement <span class="tag amb">à lire sur FTS</span></div></div></div>
      <p class="note">Mali et Niger seront lus sur FTS à la même date que le Burkina (automatisation à venir) ; en attendant, chiffres publics provisoires.</p></div>
    <div class="acts">${ask('Prépare la mise à jour FTS de la quinzaine pour le chef de bureau')}${ask('Évolution du financement 2025 vs 2026 par mois')}</div>`;
}

// ---------- 7. MÉDIAS ----------
function renderMedias() {
  const M = D.medias; const m = D.meta;
  const li = a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span class="m">— ${esc(a.outlet)}, ${fd(a.d)}${a.section ? ' · ' + esc(a.section.split(' / ')[0]) : ''}</span><br>${esc(a.summary || '')}</li>`;
  let body;
  if ((M.retenus || []).length) body = `<p class="sub">Articles retenus par l'équipe PI sur la période (${M.retenus.length})</p><div class="card"><ul class="media" style="margin:0;padding-left:18px">${M.retenus.map(li).join('')}</ul></div>`;
  else if ((M.retenus_recents || []).length) body = `<p class="sub">Aucun article retenu par PI sur cette période — derniers articles retenus :</p><div class="card"><ul class="media" style="margin:0;padding-left:18px">${M.retenus_recents.map(li).join('')}</ul></div>`;
  else body = `<p class="sub">L'équipe PI n'a pas encore validé d'articles. En attendant, les histoires jugées les plus importantes par le tri automatique :</p><div class="card"><ul class="media" style="margin:0;padding-left:18px">${(M.proposes || []).map(li).join('') || '<li class="flat">rien à afficher</li>'}</ul><span class="src">tri automatique, en attente de validation PI</span></div>`;
  $('#tab-medias').innerHTML = `<h2>Ce que dit la presse</h2>${body}<div class="acts"><a class="btn" href="../medias/" target="_blank" rel="noopener">Ouvrir le monitoring médias ↗</a>${ask('Que dit la presse sur les convois ?')}</div>`;
}

// ---------- navigation & période ----------
const links = [...document.querySelectorAll('#tabs a:not(.ask)')];
function show(id) { document.querySelectorAll('section').forEach(x => x.classList.toggle('on', x.id === 'tab-' + id)); links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id)); try { localStorage.setItem('dir_tab', id); } catch (e) {} window.scrollTo(0, 0); }
links.forEach(a => a.onclick = e => { e.preventDefault(); show(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href')); });
$('#preset').onchange = () => { const v = $('#preset').value; const today = new Date(); $('#customRange').style.display = v === 'custom' ? 'inline' : 'none';
  if (v === 'week') P = { from: null, to: null }; else if (v === 'ytd') P = { from: today.getFullYear() + '-01-01', to: iso(today) }; else if (v !== 'custom') P = { from: iso(new Date(today - (v - 1) * 864e5)), to: iso(today) }; else return;
  try { localStorage.setItem('dir_preset', v); } catch (e) {} load(); };
$('#goRange').onclick = () => { if ($('#dFrom').value && $('#dTo').value) { P = { from: $('#dFrom').value, to: $('#dTo').value }; load(); } };
(async () => {
  if (!(await AUTH.ready)) { $('#loading').style.display = 'none'; return; }
  let first = location.hash.slice(1); try { first = first || localStorage.getItem('dir_tab'); } catch (e) {}
  show(document.getElementById('tab-' + first) ? first : 'faits');
  try { const p = localStorage.getItem('dir_preset'); if (p && p !== 'custom') { $('#preset').value = p; $('#preset').onchange(); return; } } catch (e) {}
  AUTH.log && AUTH.log('direction_open', null);
  load();
})();
</script>
